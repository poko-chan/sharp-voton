<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- タイマーの背景（淡いミント）と輪郭（グリーン） -->
  <circle cx="12" cy="13" r="8.5" fill="#E6F7F5" stroke="#00BBA7" stroke-width="2" />

  <!-- 上部ボタン（アクセントのコーラルピンク） -->
